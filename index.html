<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Investment Dashboard PRO - Live Data</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            color: #e2e8f0;
            padding: 20px;
        }
        .container { max-width: 2200px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-content { flex: 1; }
        .header h1 {
            font-size: 2.2em;
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .refresh-btn {
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            border: none;
            color: #000;
            padding: 12px 20px;
            font-size: 0.95em;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-btn:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); }
        .refresh-btn.spinning { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .status { font-size: 0.9em; color: #10b981; margin-top: 5px; }

        .tabs { display: flex; gap: 0; margin-bottom: 30px; border-bottom: 2px solid #1e293b; flex-wrap: wrap; }
        .tab { padding: 15px 20px; cursor: pointer; background: transparent; border: none; color: #64748b; font-weight: 600; font-size: 0.95em; transition: all 0.3s; }
        .tab:hover { color: #10b981; }
        .tab.active { color: #10b981; border-bottom: 3px solid #10b981; padding-bottom: 12px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .section-title { font-size: 1.4em; font-weight: 700; margin: 25px 0 15px; color: #f1f5f9; }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #3b82f6;
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.15);
        }

        .card-title { font-size: 1.2em; font-weight: 700; margin-bottom: 8px; color: #f1f5f9; }
        .card-meta { font-size: 0.85em; color: #64748b; margin-bottom: 12px; }
        .card-value { font-size: 1.8em; font-weight: 700; margin-bottom: 8px; }
        .card-change { font-size: 1.1em; margin-bottom: 12px; font-weight: 600; }

        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.75em; font-weight: 600; display: inline-block; margin-right: 8px; margin-bottom: 8px; }
        .badge-green { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid #10b981; }

        .text-green { color: #10b981; }
        .text-red { color: #ef4444; }
        .text-blue { color: #3b82f6; }

        .loading { text-align: center; color: #64748b; font-size: 1.1em; padding: 40px; }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>🎯 Master Investment Dashboard PRO</h1>
                <p style="color: #64748b; margin-top: 10px;">Real-Time Market Data • Live Stock Prices • Updated Every 5 Minutes</p>
                <div class="status" id="status">🟢 Live Data Connected</div>
            </div>
            <button class="refresh-btn" id="refreshBtn" onclick="fetchLiveData()">
                <span id="refreshIcon">🔄</span>
                <span>Refresh Now</span>
            </button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('view1')">📊 Indian Stocks (LIVE)</button>
            <button class="tab" onclick="switchTab('view2')">🌍 Global Markets</button>
            <button class="tab" onclick="switchTab('view3')">📈 Indices</button>
        </div>

        <div id="view1" class="tab-content active">
            <div class="section-title">📊 Indian Stocks - Real Time Prices</div>
            <div class="loading" id="loading1">⏳ Fetching live data from Finnhub...</div>
            <div class="dashboard-grid" id="indianStocks"></div>
        </div>

        <div id="view2" class="tab-content">
            <div class="section-title">🌍 Global Markets</div>
            <div class="loading" id="loading2">⏳ Fetching global data...</div>
            <div class="dashboard-grid" id="globalMarkets"></div>
        </div>

        <div id="view3" class="tab-content">
            <div class="section-title">📈 Market Indices</div>
            <div class="loading" id="loading3">⏳ Fetching indices...</div>
            <div class="dashboard-grid" id="indices"></div>
        </div>
    </div>

    <script>
        // Finnhub API Configuration
        const FINNHUB_API_KEY = 'dbhdte9r01qjpoc756r0dbhdte9r01qjpoc756rg';
        const FINNHUB_BASE_URL = 'https://finnhub.io/api/v1';

        // Stock symbols to track
        const indianStocks = {
            'TCS': { name: 'Tata Consultancy Services', symbol: 'TCS.NS' },
            'INFY': { name: 'Infosys', symbol: 'INFY.NS' },
            'KOTAKBANK': { name: 'Kotak Mahindra Bank', symbol: 'KOTAKBANK.NS' },
            'CIPLA': { name: 'Cipla', symbol: 'CIPLA.NS' },
            'LT': { name: 'Larsen & Toubro', symbol: 'LT.NS' },
            'AXISBANK': { name: 'Axis Bank', symbol: 'AXISBANK.NS' }
        };

        const globalStocks = {
            'AAPL': { name: 'Apple', symbol: 'AAPL' },
            'GOOGL': { name: 'Google', symbol: 'GOOGL' },
            'MSFT': { name: 'Microsoft', symbol: 'MSFT' }
        };

        const indices = {
            '^NSEI': { name: 'Nifty 50', symbol: '^NSEI' },
            '^BSESN': { name: 'Sensex', symbol: '^BSESN' },
            '^GSPC': { name: 'S&P 500', symbol: '^GSPC' }
        };

        // Fetch live data from Finnhub
        async function fetchStockData(symbol) {
            try {
                const response = await fetch(`${FINNHUB_BASE_URL}/quote?symbol=${symbol}&token=${FINNHUB_API_KEY}`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching data for', symbol, error);
                return null;
            }
        }

        // Create card HTML
        function createCard(name, symbol, price, change, changePercent) {
            const changeColor = changePercent >= 0 ? 'text-green' : 'text-red';
            const changeSymbol = changePercent >= 0 ? '▲' : '▼';

            return `
                <div class="card">
                    <div class="card-title">${name}</div>
                    <div class="card-meta">📌 ${symbol}</div>
                    <div class="card-value">₹${price ? price.toFixed(2) : 'N/A'}</div>
                    <div class="card-change ${changeColor}">${changeSymbol} ${changePercent ? Math.abs(changePercent).toFixed(2) : '0.00'}%</div>
                    <span class="badge badge-green">LIVE</span>
                </div>
            `;
        }

        // Fetch and display Indian stocks
        async function displayIndianStocks() {
            const container = document.getElementById('indianStocks');
            const loading = document.getElementById('loading1');

            container.innerHTML = '';
            loading.style.display = 'block';

            for (const [key, stock] of Object.entries(indianStocks)) {
                const data = await fetchStockData(stock.symbol);
                if (data && data.c) {
                    const html = createCard(stock.name, key, data.c, data.d, data.dp);
                    container.innerHTML += html;
                } else {
                    container.innerHTML += `<div class="card"><div class="card-title">${stock.name}</div><div class="card-meta">Error loading data</div></div>`;
                }
            }
            loading.style.display = 'none';
        }

        // Fetch and display global markets
        async function displayGlobalMarkets() {
            const container = document.getElementById('globalMarkets');
            const loading = document.getElementById('loading2');

            container.innerHTML = '';
            loading.style.display = 'block';

            for (const [key, stock] of Object.entries(globalStocks)) {
                const data = await fetchStockData(stock.symbol);
                if (data && data.c) {
                    const html = createCard(stock.name, key, data.c, data.d, data.dp);
                    container.innerHTML += html;
                }
            }
            loading.style.display = 'none';
        }

        // Fetch and display indices
        async function displayIndices() {
            const container = document.getElementById('indices');
            const loading = document.getElementById('loading3');

            container.innerHTML = '';
            loading.style.display = 'block';

            for (const [key, stock] of Object.entries(indices)) {
                const data = await fetchStockData(stock.symbol);
                if (data && data.c) {
                    const html = createCard(stock.name, key, data.c, data.d, data.dp);
                    container.innerHTML += html;
                }
            }
            loading.style.display = 'none';
        }

        // Main fetch function
        async function fetchLiveData() {
            const btn = document.getElementById('refreshBtn');
            const icon = document.getElementById('refreshIcon');

            btn.disabled = true;
            icon.classList.add('spinning');

            await displayIndianStocks();
            await displayGlobalMarkets();
            await displayIndices();

            btn.disabled = false;
            icon.classList.remove('spinning');

            // Show confirmation
            btn.innerHTML = '<span>✓ Updated</span>';
            setTimeout(() => {
                btn.innerHTML = '<span id="refreshIcon">🔄</span><span>Refresh Now</span>';
            }, 2000);
        }

        // Switch tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        // Auto-fetch every 5 minutes
        setInterval(fetchLiveData, 5 * 60 * 1000);

        // Initial load
        window.addEventListener('load', () => {
            fetchLiveData();
        });
    </script>
</body>
</html>
